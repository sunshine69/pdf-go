# Log rotation for the signing service.
#
# copytruncate is the only safe form here. The service opens log_path once,
# with O_APPEND, and keeps the handle for its whole life. copytruncate
# truncates the same inode, so the open handle keeps writing at the new end of
# file and the service needs no reload signal. A rotation that renames the file
# ("create") would leave the process writing to the renamed inode: every line
# written after the rotation lands in the rotated file, and the new log stays
# empty.
#
# Install as /etc/logrotate.d/signsrv. The log is JSON lines and carries the
# request ids a support ticket quotes, so 12 weeks of history is the retention.
# The file is 0640 and owned by the service user, so the rotation runs as that
# user; a rotation as root would create a log a service user cannot write.

/var/lib/signsrv/log/signsrv.jsonl {
    weekly
    rotate 12
    size 20M
    missingok
    compress
    delaycompress
    copytruncate
    create 0640 signsrv signsrv
}
