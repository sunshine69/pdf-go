# docker-compose.yml — signsrv behind Caddy, the shape docs/DEPLOY-DOCKER.md uses.
#
# Copy this, put the two secrets in .env, and adjust the TLS domain. It is not
# meant to be committed with real secrets: keep .env mode 0600 and out of git.
#
#   docker compose up -d
#   docker compose run --rm signsrv checkconfig
#   docker compose logs -f signsrv
#
# Both containers use the host network. The reason is reachability, not
# hardening: a container's 127.0.0.1 belongs to that container alone, so on a
# bridge network Caddy cannot reach 127.0.0.1:8080 at all. Host networking lets
# it, and lets the listener stay loopback so nothing is reachable from outside
# the box.
#
# That is the recommended shape, not a requirement. The service binds whatever
# address you name; where the listener sits is your infrastructure's decision.
# Three supported shapes, all of them real deployments:
#
#   A. host networking, loopback listener (below) — the proxy and the service
#      share the host namespace, and nothing is reachable from outside.
#   B. host networking, published listener — set SIGNSRV_LISTEN=0.0.0.0:8080
#      and let the firewall or the network policy hold the line. `serve` prints
#      a warning (not a refusal) that it speaks plain HTTP, so TLS, a proxy, or
#      network policy has to terminate encryption in front of it. With nothing
#      in front of it, also set SIGNSRV_TRUST_PROXY=0 below: Caddy sets
#      X-Forwarded-For, and trusting that header from direct clients lets a
#      party choose the address the rate limits are keyed to.
#   C. a user-defined bridge, no network_mode, with `ports:` publishing 8080 and
#      the proxy joined to the same network. The service must listen on
#      0.0.0.0:8080 inside the container for the mapping to work at all:
#
#        signsrv:
#          networks: [signsrv]
#          ports: ["127.0.0.1:8080:8080"]      # bind publish to loopback only
#          environment:
#            SIGNSRV_LISTEN: 0.0.0.0:8080
#
#      Shape C is the one to pick when something on the host already owns the
#      ports — but it means the container network is the boundary, so publish on
#      127.0.0.1 rather than on 0.0.0.0 unless the proxy needs the outside.
#
# SIGNSRV_PUBLIC_URL must match the address the browser is sent to. The signing
# links are built from it, so a mismatch produces links that look real and go
# nowhere, and no check can catch it.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      SIGNTLS_DOMAIN: pdfsign.example.org
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - signsrv

  signsrv:
    image: signsrv:v0.0.1
    restart: unless-stopped
    network_mode: host
    environment:
      # Shape A. For B set 0.0.0.0:8080; for C set 0.0.0.0:8080, drop
      # network_mode, and use the networks/ports block at the bottom.
      SIGNSRV_LISTEN: 127.0.0.1:8080
      SIGNSRV_PUBLIC_URL: https://pdfsign.example.org
      # Caddy sets X-Forwarded-For. Without this the rate limits bind to the
      # socket peer, which is Caddy, so every party on the internet would share
      # one bucket.
      SIGNSRV_TRUST_PROXY: "1"
      SIGNSRV_DEV: "0"
      SIGNSRV_MAIL_FROM: signer@example.org
      SIGNSRV_SMTP_HOST: smtp.example.org
      SIGNSRV_SMTP_PORT: "587"
      SIGNSRV_TSA_URL: https://freetsa.org/tsr
    env_file:
      - path: .env
        required: true   # SIGNSRV_KEYSTORE_PASS, SIGNSRV_ADMIN_PASSWORD,
                         # and SIGNSRV_SMTP_USER / SIGNSRV_SMTP_PASS when the
                         # relay needs authentication
    volumes:
      - signsrv-data:/var/lib/signsrv

# Shape C, for a host whose ports are already taken. Uncomment, delete both
# network_mode lines, and put caddy on the same network. Do not publish on
# 0.0.0.0:8080 unless the proxy has to reach it from outside this machine:
# the service speaks plain HTTP, and the party's signing link carries a token.
#
# networks:
#   signsrv:
#
# services:
#   caddy:
#     networks: [signsrv]
#   signsrv:
#     networks: [signsrv]
#     ports:
#       - "127.0.0.1:8080:8080"
#     environment:
#       SIGNSRV_LISTEN: 0.0.0.0:8080

volumes:
  signsrv-data:
  caddy-data:
  caddy-config:
