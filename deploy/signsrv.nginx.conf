# TLS termination for signsrv, nginx form. The reference for this project is
# deploy/Caddyfile; this is the same shape for an nginx front.
#
# signsrv listens on loopback (127.0.0.1:8090) and holds no certificate.
# public_url is https://pdfsign.kaykraft.org, so the certificate is here.
#
# Replace the certificate paths, and the listen address if nginx runs on a
# different machine than signsrv.
#
# Two rules are security properties, not cosmetics:
#
#  1. X-Forwarded-For must be OVERWRITTEN, not appended. signsrv has
#     trust_proxy=true, so it reads the address from this header and the
#     rate-limit buckets are keyed on it. A proxy that appends lets a client
#     forge the address: a forged XFF means a rate limit on an address the
#     attacker chose, so 5 logins per minute per victim becomes unlimited.
#     Verified from this host: a request carrying
#     "X-Forwarded-For: 203.0.113.9" through the proxy appears in the signsrv
#     log with ip=203.0.113.9. Use `proxy_set_header X-Forwarded-For $remote_addr`
#     and NOT $proxy_add_x_forwarded_for.
#
#  2. 8090 must not be reachable except through nginx. The service cannot
#     tell a proxy from a direct client, so a direct connection with a forged
#     header is the same attack. Bind signsrv to 127.0.0.1 only, and firewall
#     the port if nginx is on another host.

server {
    listen 443 ssl;
    http2 on;
    server_name pdfsign.kaykraft.org;

    ssl_certificate     /etc/nginx/pdfsign.kaykraft.org.crt;
    ssl_certificate_key /etc/nginx/pdfsign.kaykraft.org.key;

    # A signing page is a page where a token is carried in the URL, so an
    # https-only policy removes the downgrade that ships the token along a
    # plain path. One year, includeSubDomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # SAMEORIGIN, not DENY: the signing page frames the document it shows, and
    # that frame is this same origin. DENY blocks a same-origin frame, and the
    # signer sees "refused to connect" where the document should be.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # A body over the upload limit is refused at the edge. signsrv accepts
    # templates up to max_pdf_mb (25 MB); 26 MB clears that plus the
    # multipart framing.
    client_max_body_size 26m;

    # The request body is read in full by signsrv; buffering off keeps the
    # upload to the service from being written to disk twice.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id "";
        proxy_connect_timeout 5s;
        # Signing includes a TSA call, so a signing request can take a
        # while. signsrv's own WriteTimeout is 60s.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # The admin console is not a public page. Uncomment, with the network the
    # operators are on. Without a limit, a leaked admin password is enough to
    # run the service from anywhere.
    #
    # location ~ ^/(admin|api/v1/admin) {
    #     allow 192.168.20.0/24;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8090;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Plain HTTP: redirect, so a signing link typed as http:// reaches the
    # https site. The token is not carried over the plain leg.
    #
    # server {
    #     listen 80;
    #     server_name pdfsign.kaykraft.org;
    #     return 301 https://$host$request_uri;
    # }
}
